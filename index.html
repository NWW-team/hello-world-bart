<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Vibecoden</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg), #1a1033);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.subtitle {
      margin: 0 0 32px;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 24px 0;
    }

    .footer {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Vibecoden</span>
    <h1>Hello, World! 👋</h1>
    <p class="subtitle">
      Deze pagina is gebouwd door met Claude te praten in gewone taal —
      geen regel code zelf getypt. Dat is vibecoden: je beschrijft wat je wilt,
      en de AI bouwt het.
    </p>
    <div class="divider"></div>
    <p class="footer">
      Gemaakt door <strong>Bart</strong> met wat hulp van Claude Code.
    </p>
  </main>
</body>
</html>
